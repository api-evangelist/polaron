aid: polaron
name: Polaron
description: >-
  Polaron is a London-based AI software company that builds "the intelligence layer for
  materials science." Its platform applies machine learning to microscopy and image data to
  automate microstructure analysis, connecting process, structure, and performance so materials
  engineering teams can characterise, design, and manufacture materials faster and with less
  uncertainty. The platform centers on three core model families: Segmentation (identifying and
  measuring microstructural features), Reconstruction (converting 2D micrographs into 3D
  representations), and Design (optimising microstructural parameters). It is applied across
  batteries, metals and alloys, composites, ceramics, additive manufacturing, and pharmaceuticals,
  spanning R&D, quality and qualification, and modelling and simulation workflows. Polaron is
  backed by Speedinvest and research institutions including Imperial College London, Manchester,
  Oxford, and Cambridge.
